<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Superior EHS — Corrective Action Board</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#f8fafc;color:#1e293b;padding:14px}
h1{font-size:17px;font-weight:700;margin-bottom:4px}
.sub{font-size:11px;color:#64748b;margin-bottom:10px}
.filt{display:inline-block;font-size:10px;padding:3px 8px;border-radius:4px;background:#e2e8f0;color:#475569;cursor:pointer;border:none;font-weight:600;margin-right:4px;margin-bottom:6px}
.filt.active{background:#3b82f6;color:#fff}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:8px 10px;margin-bottom:5px;border-left:3px solid #f59e0b}
.card.done{border-left-color:#22c55e;opacity:0.5}
.card.inv{border-left-color:#8b5cf6}
.cid{font-size:9px;color:#94a3b8;font-weight:700}
.ct{font-size:12px;font-weight:600;margin:2px 0;line-height:1.3}
.cm{font-size:10px;color:#64748b}
.tag{font-size:8px;padding:1px 5px;border-radius:2px;font-weight:600;display:inline-block;margin-right:3px}
.to{background:#fef3c7;color:#92400e}
.ta{background:#dbeafe;color:#1e40af}
.td{background:#d1fae5;color:#065f46}
.empty{padding:30px;text-align:center;color:#94a3b8;font-size:13px}
.ft{font-size:9px;color:#94a3b8;text-align:center;margin-top:12px}
</style>
</head>
<body>

<h1>Corrective Action Board</h1>
<div class="sub" id="sub">Superior Huntingdon Composites — Loading...</div>

<div id="filters"></div>
<div id="list"><div class="empty">Loading from cloud...</div></div>
<div class="ft" id="ft"></div>

<script>
var DB = "https://superior-ehs-default-rtdb.firebaseio.com";
var all = [];
var filter = "all";

function xhr(path, callback) {
  var x = new XMLHttpRequest();
  x.open("GET", DB + path + ".json", true);
  x.onload = function() {
    if (x.status >= 200 && x.status < 400) {
      try { callback(JSON.parse(x.responseText)); }
      catch(e) { callback(null); }
    } else { callback(null); }
  };
  x.onerror = function() { callback(null); };
  x.send();
}

function load() {
  xhr("/corrective_actions", function(data) {
    if (data) {
      all = Object.keys(data).map(function(k) { return data[k]; });
    } else {
      all = [];
    }
    render();
  });
}

function render() {
  var items = all;
  var filtered = [];
  for (var i = 0; i < items.length; i++) {
    var a = items[i];
    if (filter === "open" && a.status === "Done") continue;
    if (filter === "overdue" && (a.status === "Done" || !a.due || a.due === "N/A")) continue;
    if (a.visibility === "Private") continue;
    filtered.push(a);
  }

  document.getElementById("sub").textContent = filtered.length + " of " + all.length + " corrective actions | Management view";

  var fhtml = "";
  var filters = ["all","open","overdue"];
  for (var i = 0; i < filters.length; i++) {
    var f = filters[i];
    fhtml += '<button class="filt' + (f === filter ? " active" : "") + '" onclick="setF(\'' + f + '\')">' + f.charAt(0).toUpperCase() + f.slice(1) + '</button>';
  }
  document.getElementById("filters").innerHTML = fhtml;

  var div = document.getElementById("list");
  if (filtered.length === 0) {
    div.innerHTML = '<div class="empty">No corrective actions to show.</div>';
    document.getElementById("ft").textContent = "Superior Huntingdon Composites | Last loaded " + new Date().toLocaleString();
    return;
  }

  var html = "";
  for (var i = 0; i < filtered.length; i++) {
    var a = filtered[i];
    var cls = a.status === "Done" ? " done" : a.status === "Investigation" ? " inv" : "";
    var tag = "";
    if (a.status === "Open" || a.status === "Investigation") tag = '<span class="tag to">' + a.status + '</span>';
    else if (a.status === "In Progress") tag = '<span class="tag ta">Active</span>';
    else if (a.status === "Done") tag = '<span class="tag td">Done</span>';
    var due = a.due && a.due !== "N/A" ? 'Due ' + a.due : "";
    var owner = a.owner ? '<b>' + a.owner + '</b> ' : "";
    html += '<div class="card' + cls + '"><div style="display:flex;gap:3px;flex-wrap:wrap">' + tag + '<span class="cid">' + (a.id || "") + '</span></div><div class="ct">' + (a.item || "") + '</div><div class="cm">' + owner + due + '</div></div>';
  }
  div.innerHTML = html;
  document.getElementById("ft").textContent = "Superior Huntingdon Composites | Last loaded " + new Date().toLocaleString();
}

function setF(f) {
  filter = f;
  render();
}

load();
</script>
</body>
</html>
