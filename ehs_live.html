<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Superior EHS — Corrective Actions</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;padding:16px}
.nav-bar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.nav-btn{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;color:#94a3b8;cursor:pointer;border:none;background:transparent}
.nav-btn.active{background:rgba(59,130,246,0.15);color:#60a5fa}
.action-card{background:linear-gradient(135deg,rgba(30,41,59,0.8),rgba(15,23,42,0.6));border:1px solid rgba(59,130,246,0.2);border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.action-card.overdue{border-left:3px solid #ef4444}
.action-card.open{border-left:3px solid #f59e0b}
.action-card.done{border-left:3px solid #22c55e}
.action-id{font-size:10px;font-weight:700;color:#64748b;white-space:nowrap}
.action-title{font-size:13px;font-weight:500;color:#f8fafc;line-height:1.3}
.action-meta{font-size:11px;color:#64748b;margin-top:2px}
.badge{font-size:9px;padding:1px 6px;border-radius:3px;font-weight:600;text-transform:uppercase}
.badge-open{background:rgba(245,158,11,0.15);color:#f59e0b}
.badge-active{background:rgba(59,130,246,0.15);color:#60a5fa}
.badge-closed{background:rgba(34,197,94,0.15);color:#22c55e}
.badge-private{background:rgba(239,68,68,0.15);color:#ef4444;margin-left:4px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:100}
.modal-content{background:#1e293b;border:1px solid rgba(59,130,246,0.3);border-radius:12px;padding:20px;width:90%;max-width:500px}
input,textarea,select{width:100%;padding:8px;margin:4px 0 8px;background:#0f172a;border:1px solid #475569;border-radius:6px;color:#e2e8f0;font-size:13px}
label{font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-top:6px}
h1{font-size:18px;font-weight:700}
</style>
</head>
<body>
<h1>✅ Corrective Actions</h1>
<div style="font-size:12px;color:#64748b;margin-bottom:10px" id="subtitle"></div>

<div class="nav-bar">
  <button class="nav-btn active" onclick="setFilter('all')" id="f-all">All</button>
  <button class="nav-btn" onclick="setFilter('open')" id="f-open">Open</button>
  <button class="nav-btn" onclick="setFilter('mine')" id="f-mine">My Queue</button>
  <button class="nav-btn" onclick="setFilter('overdue')" id="f-overdue">Overdue</button>
  <button class="nav-btn" onclick="setFilter('management')" id="f-mgmt">Mgmt View</button>
  <div style="flex:1"></div>
  <button class="nav-btn" style="color:#22c55e;font-weight:700" onclick="showAdd()">+ Add</button>
  <button class="nav-btn" onclick="location.reload()">🔄</button>
</div>

<div id="action-list"></div>

<!-- Add modal -->
<div id="modal" class="modal" style="display:none" onclick="if(event.target===this)hideAdd()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div style="font-size:16px;font-weight:700;margin-bottom:8px">New Corrective Action</div>
    <label>Action Description</label>
    <textarea id="ca-item" rows="2" placeholder="e.g. Paint walkway markings..."></textarea>
    <label>Owner</label>
    <input id="ca-owner" placeholder="e.g. Justin, Bryan, Matt..." onclick="quickOwner(this)">
    <label>Due Date</label>
    <input id="ca-due" placeholder="MM/DD" onclick="this.value='11/'+prompt('Day?')">
    <label>Visibility</label>
    <select id="ca-vis">
      <option value="Private">Private (Justin + me)</option>
      <option value="Management" selected>Management (managers + Greg)</option>
      <option value="Executive"Executive (Greg + Jason + Tom)</option>
    </select>
    <label>Status</label>
    <select id="ca-status">
      <option>Open</option><option>In Progress</option><option>Waiting</option><option>Done</option>
    </select>
    <div style="display:flex;gap:6px;margin-top:10px">
      <button onclick="saveAction()" style="flex:1;padding:8px;background:#3b82f6;border:none;border-radius:6px;color:#fff;font-weight:600;cursor:pointer">Save</button>
      <button onclick="hideAdd()" style="flex:1;padding:8px;background:transparent;border:1px solid #475569;border-radius:6px;color:#94a3b8;cursor:pointer">Cancel</button>
    </div>
  </div>
</div>

<script>
const DB = 'https://superior-ehs-default-rtdb.firebaseio.com';
async function fb(p,m='GET',d=null){
  const o={method:m,headers:{'Content-Type':'application/json'}};
  if(d) o.body=JSON.stringify(d);
  try{return await(await fetch(DB+p+'.json',o)).json();}catch(e){return null;}
}

let actions = [];
let filter = 'all';

async function load() {
  const data = await fb('/corrective_actions');
  actions = data ? Object.values(data) : [];
  render();
}

function render() {
  // Bonnie incident
  let list = [...actions];
  // Add Bonnie as a pinned reference
  const bonnie = {id:'INCIDENT-BONNIE',item:'Bonnie Swim - 11/7 recordable (pallet trip, hospital, groin) - USE for CA training case',owner:'Justin',due:'N/A',status:'Investigation',visibility:'Management'};
  
  let filtered = list;
  if(filter==='open') filtered = list.filter(a => a.status==='Open');
  else if(filter==='overdue') filtered = list.filter(a => a.status==='Open' && parseInt(a.due?.split('/')[1]||99) < new Date().getDate());
  else if(filter==='mine') filtered = list.filter(a => (a.owner||'').toLowerCase().includes('justin'));
  else if(filter==='management') filtered = list.filter(a => a.visibility!=='Private');
  
  // Sort: open first, then by due date
  filtered.sort((a,b) => {
    const s = {'Open':0,'In Progress':1,'Waiting':2,'Done':3,'Investigation':0};
    return (s[a.status]||9) - (s[b.status]||9) || ((a.due||'99').localeCompare(b.due||'99'));
  });
  
  document.getElementById('subtitle').textContent = filtered.length + ' actions (' + list.length + ' total)';
  
  const div = document.getElementById('action-list');
  if(!filtered.length && filter!=='all') {
    div.innerHTML = '<div style="text-align:center;padding:40px;color:#64748b;font-size:14px">No ' + filter + ' actions.</div>';
    return;
  }
  
  const items = filtered.length ? filtered : [{
    id:'💡',item:'No corrective actions yet. Click + Add to create one.',owner:'',due:'',status:'',visibility:''
  }];
  
  let html = '<div style="margin-bottom:8px;padding:6px 10px;background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.25);border-radius:6px;font-size:11px;color:#f59e0b">📌 Use this to track corrective actions for all incidents.</div>';
  
  // Show the Bonnie incident as a pinned example at top
  html += '<div class="action-card open"><div style="flex:1"><div style="display:flex;gap:4px;flex-wrap:wrap"><span class="action-id">INCIDENT</span><span class="badge badge-open">Recordable</span></div><div class="action-title">Bonnie Swim - 11/7 - Tripped on uneven pallet, sent to hospital</div><div class="action-meta">Real incident from Saturday — correctives: paint walkway, mark pallet zone, fire extinguisher clearance. Use this to train supervisors on proper corrective actions.</div></div></div>';
  
  html += items.map(a => {
    const cls = a.status==='Done'?'done':a.status==='Open'||a.status==='Investigation'?'open':a.status==='Waiting'?'open':'';
    const days = a.due && a.due!=='N/A' ? '<span style="color:'+(parseInt(a.due.split('/')[1]||99)<new Date().getDate()&&a.status!=='Done'?'#ef4444':'#64748b')+'">Due ' + a.due + '</span>' : '';
    const vis = a.visibility==='Private' ? '<span class="badge badge-private">Private</span>' : '';
    const badge = a.status==='Open'?'<span class="badge badge-open">Open</span>':a.status==='In Progress'?'<span class="badge badge-active">Active</span>':a.status==='Done'?'<span class="badge badge-closed">Done</span>':a.status==='Investigation'?'<span class="badge badge-open">Investigation</span>':'<span class="badge badge-open">'+a.status+'</span>';
    return '<div class="action-card ' + cls + '"><div style="flex:1"><div style="display:flex;gap:4px;flex-wrap:wrap"><span class="action-id">' + (a.id||'CA-?') + '</span>' + badge + vis + '</div><div class="action-title">' + a.item + '</div><div class="action-meta"><b>' + (a.owner||'?') + '</b> ' + days + '</div></div></div>';
  }).join('');
  
  if(filtered.length > 0) {
    html += '<div style="margin-top:12px;font-size:10px;color:#475569;text-align:center">Tap + Add to create a new action. Reload to refresh from cloud.</div>';
  }
  div.innerHTML = html;
}

function setFilter(f) {
  filter=f;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('f-'+f).classList.add('active');
  render();
}

function showAdd(){document.getElementById('modal').style.display='flex';}
function hideAdd(){document.getElementById('modal').style.display='none';}
function quickOwner(inp){if(!inp.value)inp.value='Justin';}

async function saveAction() {
  const item = document.getElementById('ca-item').value.trim();
  const owner = document.getElementById('ca-owner').value.trim() || 'Justin';
  const due = document.getElementById('ca-due').value.trim() || 'N/A';
  const vis = document.getElementById('ca-vis').value;
  const status = document.getElementById('ca-status').value;
  if(!item) { alert('Enter an action description'); return; }
  const id = 'CA-' + String(actions.length + 1).padStart(3,'0');
  await fb('/corrective_actions/' + id, 'PUT', {id,item,owner,due,visibility:vis,status});
  hideAdd();
  // Reset form
  document.getElementById('ca-item').value='';
  document.getElementById('ca-owner').value='';
  document.getElementById('ca-due').value='';
  await load();
}

load();
</script>
</body></html>
