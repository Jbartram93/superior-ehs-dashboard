<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="600">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EHS — Justin's Dashboard</title>
<script src="firebase/firebase-app-compat.js"></script>
<script src="firebase/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#04060b;color:#e2e8f0;font-family:Segoe UI,Arial,sans-serif;padding:12px 14px;min-height:100vh;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e293b;padding-bottom:8px;margin-bottom:12px}
.clock{font-size:40px;font-weight:700;color:#f8fafc}
.date{font-size:13px;color:#64748b;margin-top:1px}
.tagline{font-size:10px;color:#3b82f6;text-align:right}
.cal{display:flex;gap:2px;margin-bottom:12px}
.day{flex:1;text-align:center;padding:6px 2px 4px;background:#0b1120;border:1px solid #1e293b;border-radius:5px;cursor:pointer;min-height:70px}
.day:active{background:#1e3a5f;border-color:#3b82f6}
.day.today{background:#0f1a2e;border-color:#3b82f6}
.day-name{font-size:9px;color:#64748b;text-transform:uppercase}
.day-num{font-size:20px;font-weight:700;color:#f8fafc;margin:0}
.day.today .day-num{color:#60a5fa}
.evt-tag{display:inline-block;padding:0 3px;margin:1px 0;border-radius:2px;font-size:7px;background:rgba(59,130,246,0.15);color:#60a5fa;line-height:1.2;width:100%}
.evt-tag.o{background:rgba(245,158,11,0.12);color:#f59e0b}
.evt-tag.g{background:rgba(34,197,94,0.1);color:#22c55e}
.section-title{font-size:10px;font-weight:700;color:#60a5fa;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;margin-top:8px}
.quote{font-size:14px;color:#64748b;font-style:italic;padding:8px 10px;background:#0b1120;border:1px solid #1e293b;border-radius:5px;margin-bottom:10px;line-height:1.3;text-align:center}
.action-row{display:flex;gap:6px;margin-bottom:4px}
.action-btn{flex:1;text-align:center;padding:6px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;background:#0b1120;border:1px solid #1e293b;color:#e2e8f0}
.action-btn:active{background:#1e3a5f;border-color:#3b82f6}
.lanes{display:flex;gap:6px}
.lane{flex:1;background:#0b1120;border:1px solid #1e293b;border-radius:5px;padding:8px}
.lane-hdr{font-size:9px;font-weight:700;color:#60a5fa;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #1e293b;padding-bottom:4px;margin-bottom:4px}
.ti{padding:4px 0;font-size:12px;display:flex;gap:6px;align-items:flex-start;border-bottom:1px solid rgba(255,255,255,0.02);cursor:pointer;user-select:none}
.ti:active{background:rgba(59,130,246,0.06);border-radius:3px;padding:4px 2px}
.ti.done{opacity:0.3;text-decoration:line-through}
.cb{width:14px;height:14px;border:1.5px solid #3b82f6;border-radius:3px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;background:transparent;transition:0.1s}
.cb.checked{background:#22c55e;border-color:#22c55e}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:4px}
.dr{background:#ef4444}.da{background:#f59e0b}.db{background:#3b82f6}.dg{background:#22c55e}
.ti-text{flex:1;line-height:1.2}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity 0.15s}
.modal.show{opacity:1;pointer-events:auto}
.modal-box{background:#0b1120;border:1px solid rgba(59,130,246,0.3);border-radius:8px;padding:14px 16px;width:85%;max-width:350px}
.modal-box h3{font-size:14px;color:#f8fafc;margin-bottom:2px}
.modal-box .sub{font-size:11px;color:#64748b;margin-bottom:6px}
.modal-box button{padding:8px;border:none;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;width:100%}
.btn-primary{background:#3b82f6;color:#fff}
.bot-bar{display:flex;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid #1e293b}
.bot-btn{flex:1;padding:8px;border-radius:6px;font-size:12px;font-weight:600;text-align:center;text-decoration:none}
.bot-btn.chat{background:#3b82f6;color:#fff}
.bot-btn.dump{background:#0b1120;color:#f59e0b;border:1px solid #f59e0b}
</style>
</head>
<body>

<div class="top">
  <div><div class="clock" id="clock">--</div><div class="date" id="date">--</div></div>
  <div class="tagline">Justin · EHS Leader</div>
</div>

<div class="cal" id="cal"></div>

<div class="quote" id="quote">Loading...</div>

<div class="section-title">Today's Focus</div>
<div id="weekly-todos"></div>

<div class="section-title">Queue</div>
<div class="lanes">
  <div class="lane"><div class="lane-hdr">NOW</div><div id="lane-now"></div></div>
  <div class="lane"><div class="lane-hdr">NEXT</div><div id="lane-next"></div></div>
  <div class="lane"><div class="lane-hdr">LATER</div><div id="lane-later"></div></div>
</div>

<div class="bot-bar">
  <a href="tg://resolve?domain=Hermione_Grid_bot" class="bot-btn chat">&#9993; Chat</a>
  <a href="braindump.html" class="bot-btn dump">&#128221; Brain Dump</a>
</div>

<div id="modal" class="modal">
  <div class="modal-box">
    <h3 id="modal-title">Event</h3>
    <div class="sub" id="modal-sub"></div>
    <div id="modal-body" style="font-size:13px;margin:6px 0"></div>
    <button class="btn-primary" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyDmJ3hbSyfGp0nP36g-34UgKi1jaWTPf1g",
  authDomain: "superior-ehs.firebaseapp.com",
  databaseURL: "https://superior-ehs-default-rtdb.firebaseio.com",
  projectId: "superior-ehs",
  storageBucket: "superior-ehs.appspot.com",
  messagingSenderId: "887407575500",
  appId: "1:887407575500:web:ab6b5ec5f89e79b2eca10a9"
});
var db = firebase.database();
var d=new Date(),w=d.getDay(),st=new Date(d);st.setDate(d.getDate()-w);
var mmm=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var ddd=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var h=d.getHours(),m=d.getMinutes(),a=h>=12?'PM':'AM';h=h%12||12;
document.getElementById('clock').innerHTML=h+':'+(m<10?'0':'')+m+' '+a;
document.getElementById('date').innerHTML=ddd[w]+', '+mmm[d.getMonth()]+' '+d.getDate();

// Calendar events
var events=[
  [2,"9:00am","SCC Prod Call"],
  [2,"2:30pm","EHS Meeting"],
  [3,"10:00am","Dry Ice - Luke Carey"],
  [4,"10:30am","Safety Walkthrough"],
  [5,"1:00pm","Weekly Planning"],
];
var ch="";
for(var i=0;i<7;i++){
  var dt=new Date(st);dt.setDate(st.getDate()+i);
  var num=dt.getDate(),dn=ddd[i],td=(i===w?' today':''),ev="";
  for(var j=0;j<events.length;j++){
    if(events[j][0]===i){ev+='<span class="evt-tag'+(events[j][0]===w?' o':'')+'">'+events[j][1]+'</span>';}
  }
  ch+='<div class="day'+td+'" onclick="showDay(\''+dn+'\','+num+')"><div class="day-name">'+dn+'</div><div class="day-num">'+num+'</div>'+ev+'</div>';
}
document.getElementById('cal').innerHTML=ch;

// Daily quotes (rotate based on day of year)
var quotes=[
  '"Leadership is not about being in charge. It is about taking care of those in your charge." - Simon Sinek',
  '"The function of leadership is to produce more leaders, not more followers." - Ralph Nader',
  '"The only thing that stands between you and your goal is the story you keep telling yourself." - Jordan Belfort',
  '"Red is not bad. We want to find problems before someone gets hurt." - Justin Bartram',
  '"A good leader takes a little more than his share of the blame, a little less than his share of the credit." - Arnold Glasow',
  '"The best way to find yourself is to lose yourself in the service of others." - Mahatma Gandhi',
  '"The task of the leader is to get their people from where they are to where they have not been." - Henry Kissinger',
  '"A vision without execution is hallucination." - Thomas Edison',
  '"Do what you can, with what you have, where you are." - Theodore Roosevelt',
  '"If your actions inspire others to dream more, learn more, do more and become more, you are a leader." - John Quincy Adams',
];
var qidx = d.getDate() % quotes.length;
document.getElementById('quote').textContent = quotes[qidx];

function showDay(dn,num){
  var evs=[];
  for(var j=0;j<events.length;j++){if(events[j][0]===w){evs.push(events[j][1]+' - '+events[j][2]);}}
  document.getElementById('modal-title').textContent=dn+' '+num;
  document.getElementById('modal-sub').textContent='';
  document.getElementById('modal-body').innerHTML=evs.length?evs.join('<br>'):'No events today';
  document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

// Load todos from Firebase — items persist until marked done, they DON'T auto-clear
var ref=db.ref('todos');
ref.on('value',function(s){
  var data=s.val();
  var items=data?Object.values(data):[];
  // Weekly focus — show NOW items, done stays visible but crossed out
  var wh="";
  for(var i=0;i<items.length;i++){
    var t=items[i];
    if(t.lane!=='now') continue;
    if(t.done) wh+='<div class="ti done"><div class="cb checked">&#10003;</div><div class="ti-text">'+t.text+'</div></div>';
    else wh+='<div class="ti" onclick="toggleTodo(\''+t.id+'\',true)"><div class="cb"></div><div class="ti-text">'+t.text+'</div></div>';
  }
  document.getElementById('weekly-todos').innerHTML=wh||'<div style="font-size:11px;color:#475569">Tap brain dump to add tasks</div>';
  // Lanes
  var lanes={now:[],next:[],later:[]};
  for(var i=0;i<items.length;i++){var t=items[i];if(lanes[t.lane]) lanes[t.lane].push(t);}
  var colMap={now:'dr',next:'db',later:'dg'};
  for(var l in lanes){
    var html="";
    for(var i=0;i<lanes[l].length;i++){
      var t=lanes[l][i];
      html+='<div class="ti" onclick="showDetail(\''+t.id+'\',\''+t.text.replace(/'/g,"\\'")+'\')"><span class="dot '+colMap[l]+'" style="opacity:'+(t.done?'0.2':'1')+'"></span><div class="ti-text" style="'+(t.done?'text-decoration:line-through;opacity:0.3':'')+'">'+t.text+'</div></div>';
    }
    document.getElementById('lane-'+l).innerHTML=html||'<div style="font-size:10px;color:#475569">Empty</div>';
  }
});

function toggleTodo(id,done,dateKey){
  var updates={}; updates['done']=done; updates['date']=dateKey||todayKey; db.ref('todos/'+id).update(updates);
}

function showDetail(id,text,dateKey){
  document.getElementById('modal-title').textContent=text;
  document.getElementById('modal-sub').textContent='Tap to mark done';
  document.getElementById('modal-body').innerHTML='<button class="btn-primary" onclick="db.ref(\'todos/'+id+'/done\').set(true);closeModal()">Mark as Done</button><button class="btn-primary" style="background:transparent;color:#64748b;margin-top:4px;border:1px solid #475569" onclick="closeModal()">Cancel</button>';
  document.getElementById('modal').classList.add('show');
}
</script>
</body>
</html>
